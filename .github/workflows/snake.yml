
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: BielRNC
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%239E263F&color_dots=%230B0B0E,%23310B16,%235A1428,%238B1E3F,%23C13B5B
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23C13B5B&color_dots=%230B0B0E,%23310B16,%235A1428,%238B1E3F,%23C13B5B

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
